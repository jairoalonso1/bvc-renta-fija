[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bvc-renta-fija"
version = "0.3.1"
description = "Cliente Python para consultar renta fija BVC y generar reportes de mercado"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "JAG"}]
keywords = ["bvc", "renta-fija", "colombia", "scraper", "tes", "bonos", "reporte"]
dependencies = [
    "playwright>=1.40.0",
    "pandas>=2.0.0",
    "lxml>=4.9.0",
    "openpyxl>=3.1.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
cache = ["pyarrow>=14.0.0"]
dev = ["pytest>=7.0", "ruff>=0.4", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/jairoalonso1/bvc-renta-fija"
Repository = "https://github.com/jairoalonso1/bvc-renta-fija"

[tool.setuptools.packages.find]
where = ["."]
include = ["bvc_renta_fija*"]
