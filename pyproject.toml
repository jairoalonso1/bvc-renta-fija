[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bvc-renta-fija"
version = "0.1.0"
description = "Librería Python para extraer datos de renta fija de la Bolsa de Valores de Colombia (BVC)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "JAG"}]
keywords = ["bvc", "renta-fija", "colombia", "scraper", "tes", "bonos"]
dependencies = [
    "playwright>=1.40.0",
    "pandas>=2.0.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[project.urls]
Homepage = "https://github.com/jairoalonso1/bvc-renta-fija-scraper"

[tool.setuptools.packages.find]
where = ["."]
include = ["bvc_renta_fija*"]
